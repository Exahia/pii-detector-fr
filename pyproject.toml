[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-detector-fr"
version = "0.2.0"
description = "French PII detection and anonymization library with CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Exahia", email = "admin@exahia.ia" }
]
keywords = ["pii", "gdpr", "rgpd", "french", "security", "anonymization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/Exahia/pii-detector-fr"
Issues = "https://github.com/Exahia/pii-detector-fr/issues"

[project.scripts]
pii-detector = "pii_detector.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pii_detector*"]
